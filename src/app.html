<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Default SEO (will be overridden by page-specific meta tags) -->
		<title>Belgian Malinois Directory</title>
		<meta
			name="description"
			content="Your trusted resource for finding reputable breeders, expert training guides, and essential care tips for Belgian Malinois dogs."

		<!-- Default Open Graph -->
		<meta property="og:image" content="%sveltekit.assets%/belgianmalinoispup-og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Belgian Malinois Directory - Your trusted resource for Belgian Malinois information"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.assets%/belgianmalinoispup-og.png" />

		<!-- Google Ads -->
		<meta name="google-adsense-account" content="ca-pub-6372188459026911" />
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6372188459026911"
			crossorigin="anonymous"
		></script>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<!-- Umami Analytics -->

			defer
			src="https://cloud.umami.is/script.js"
			data-website-id="31e41a49-46b8-48a7-b69d-273983db50ff"
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">

	</body>
</html>
